name: Source liveness (full corpus)

on:
  schedule:
    # Weekly floor -- guarantees a run even if nothing merges for a while.
    - cron: '0 5 * * 1'
  workflow_dispatch: {}
  push:
    # The real trigger during active regeneration: every merge that touches
    # a spec.yaml re-sweeps the full corpus, not just the changed files.
    # Catching a bad citation while the record is still fresh (not 15
    # records later) is the whole point -- a fixed weekly cadence was too
    # slow for that during an active TASK-02-style regeneration run. Safe to
    # fire this often: mergeLivenessState enforces its own minimum real-time
    # gap (see infra/lib/url-liveness.mjs) before crediting a run toward
    # consecutive_dead_runs, so back-to-back merges can't fast-forward the
    # 3-run confirmation the way running this on a bare timer would.
    branches:
      - main
    paths:
      - 'catalog/**/spec.yaml'

# contents: write is required -- the last step commits and pushes a refreshed
# baseline report directly to main. Explicit rather than relying on the
# broader GITHUB_TOKEN default.
permissions:
  contents: write

# Full-corpus runs read-then-write the same committed report file. Without
# this, two runs triggered close together (e.g. two merges within minutes)
# could race on that read-modify-write and silently drop one run's
# consecutive_dead_runs update. Queue instead of racing or cancelling --
# cancelling would also cancel a run's contribution toward confirmation.
concurrency:
  group: source-liveness-full-corpus
  cancel-in-progress: false

jobs:
  full-corpus-liveness:
    name: Full-corpus source liveness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run full-corpus liveness check
        run: npm run validate:liveness -- --full-corpus

      - name: Commit updated report if changed
        run: |
          if git diff --quiet -- reports/generated/source-liveness-baseline.json; then
            echo "No change in dead-URL count/content."
            exit 0
          fi
          git config user.name "olf-steward[bot]"
          git config user.email "299857430+olf-steward[bot]@users.noreply.github.com"
          git add reports/generated/source-liveness-baseline.json
          git commit -m "chore: refresh source-liveness baseline report"
          git push origin HEAD:main
