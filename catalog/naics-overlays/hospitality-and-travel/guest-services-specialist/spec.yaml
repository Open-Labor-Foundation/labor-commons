- name: Oracle OPERA Cloud
  category: Property Management System
  purpose: Central reservation, room status, guest profile, and folio management for full-service hospitality properties.
- name: Mews
  category: Property Management System
  purpose: Cloud-native PMS for independent and lifestyle hotels handling reservations, check-in, and guest communication.
- name: Salesforce Hospitality Cloud
  category: Customer Relationship Management
  purpose: Guest profile aggregation, loyalty tracking, and personalized communication across property touchpoints.
- name: Kipsu
  category: Guest Messaging Platform
  purpose: Real-time text and web chat communication with guests for request fulfillment and service updates.
- name: HotSOS
  category: Maintenance and Service Optimization
  purpose: Work order routing and tracking for housekeeping and engineering requests generated from guest service needs.
- name: Hotel Effectiveness
  category: Housekeeping Management
  purpose: Room cleaning assignment, progress tracking, and labor optimization for stay-over and departure rooms.
- name: Knowcross
  category: Guest Request Management
  purpose: Centralized logging, routing, and status tracking of guest requests across all hotel departments.
