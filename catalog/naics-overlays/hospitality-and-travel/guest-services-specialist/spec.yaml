implementation:
  arrival_workflow:
    steps:
    - Review daily arrival manifest in PMS for VIP status, loyalty tier, and special requests
    - Pre-assign rooms based on preferences, accessibility needs, and upgrade availability
    - Prepare amenity deliveries and welcome materials for eligible loyalty tiers
    - Greet guest by name where loyalty profile permits, verify identification and payment method
    - Process registration in PMS, issue keys, and provide property orientation
    - Log any deviations or additional preferences to the guest profile
  departure_workflow:
    steps:
    - Review daily departure manifest for express checkout eligibility and folio balance
    - Present folio for review and process payment settlement under PCI DSS procedures
    - Collect keys, inspect room status, and trigger housekeeping turnover
    - Capture departure feedback and log any service issues for recovery follow-up
    - Update guest profile with stay notes for future visit personalization
  service_recovery_workflow:
    steps:
    - Acknowledge the guest complaint within the same interaction or within 15 minutes of receipt
    - Document the issue, guest impact, and root cause in the service recovery log
    - Determine recovery action within property authorization thresholds
    - Execute recovery action and communicate resolution to the guest
    - Escalate to department head or General Manager if recovery exceeds authorization or involves safety
    - Follow up with guest within 24 hours to confirm satisfaction
  request_routing_workflow:
    steps:
    - Log guest request in the request management system with timestamp and priority
    - Route to appropriate department — housekeeping for room needs, engineering for maintenance, concierge for
      external services
    - Confirm receipt with receiving department and communicate estimated completion to guest
    - Monitor request status and proactively update guest on progress
    - Close request upon completion and capture guest confirmation
