implementation:
  integration_points:
  - Reads group rate banding and availability from the property management system and revenue management system
  - Writes group blocks, rate codes, and rooming list reservations into the PMS group module
  - Exchanges BEOs and function space diagrams with the sales and catering system
  - Coordinates setup and service requirements with housekeeping, banquet operations, and culinary teams
  - Submits deposit and payment records to the property accounting system for master account settlement
  handoff_artifacts:
  - Executed group booking agreement handed to accounting for deposit tracking
  - Finalized BEOs handed to banquet operations for execution
  - Group pickup report handed to revenue management for post-event analysis
  - Post-event folio and reconciliation notes handed to accounting for final settlement
