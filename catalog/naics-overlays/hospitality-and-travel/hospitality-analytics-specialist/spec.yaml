domain_lexicon:
- term: ADR
  definition: Average Daily Rate. Total room revenue divided by rooms sold. Excludes
    comp and house-use rooms from the denominator.
- term: RevPAR
  definition: Revenue Per Available Room. Total room revenue divided by rooms available.
    Equals ADR multiplied by occupancy.
- term: TrevPAR
  definition: Total Revenue Per Available Room. All property revenue including rooms,
    food and beverage, and ancillary divided by rooms available.
- term: RGI
  definition: Revenue Generation Index. A property's RevPAR divided by the comp-set
    RevPAR, expressed as an index where 100 equals comp-set parity.
- term: Comp set
  definition: Competitive set. A group of comparable properties used as a benchmark
    for market performance comparison.
- term: Pickup
  definition: The net change in on-the-book rooms or revenue for a stay date over
    a defined measurement window.
- term: Booking pace
  definition: The rate at which reservations accumulate for a future stay date,
    compared to a prior-year or historical pace curve.
- term: Channel mix
  definition: The distribution of bookings across channels such as brand.com, OTA,
    GDS, voice, group, and direct, expressed as a percentage of total bookings.
- term: Group block
  definition: A contracted set of rooms held for a group at a negotiated rate with
    pickup, release, and attrition terms.
- term: Folio
  definition: The guest financial record containing all charges, payments, and
    adjustments for a stay or transaction.
- term: Overbooking
  definition: Accepting more reservations than available rooms to offset expected
    cancellations and no-shows.
- term: No-show
  definition: A reservation where the guest does not arrive and does not cancel,
    typically triggering a charge per property policy.
- term: Accessible-room inventory
  definition: Rooms designed and designated to meet ADA mobility, hearing, or visual
    accessibility requirements, tracked separately for utilization and compliance.
- term: Service recovery
  definition: The process of resolving a guest incident or complaint with documented
    resolution, compensation, and follow-up.
- term: Stay date
  definition: The calendar night for which a room is reserved or occupied, distinct
    from the booking date.
common_artifacts:
- name: Hospitality metric dictionary
  description: A versioned document listing every metric the specialist publishes
    with its formula, source system, source field, denominator logic, refresh window,
    staleness threshold, and known caveats.
  owner: hospitality-analytics-specialist
  consumers:
  - revenue-management-hospitality-specialist
  - hospitality-operations-specialist
  - guest-experience-specialist
- name: Analytical summary
  description: A structured summary of hospitality performance for a property, comp
    set, or portfolio over a defined period, including occupancy, ADR, RevPAR, TrevPAR,
    channel mix, booking pace, cancellation, and group block utilization with caveat
    notes.
  owner: hospitality-analytics-specialist
  consumers:
  - revenue-management-hospitality-specialist
  - hospitality-operations-specialist
  - event-and-group-bookings-specialist
- name: Reconciliation register
  description: A log of breaks between analytics-layer totals and system-of-record
    totals, with break amount, root-cause note, resolution status, and resolution
    date.
  owner: hospitality-analytics-specialist
  consumers:
  - property-systems-hospitality-specialist
  - hospitality-compliance-specialist
- name: Caveat note
  description: A structured note attached to an analytical summary or metric value
    flagging source gaps, definitional ambiguity, comp-set changes, property openings
    or closings, system migrations, or manual adjustments that affect comparability.
  owner: hospitality-analytics-specialist
  consumers:
  - revenue-management-hospitality-specialist
  - hospitality-operations-specialist
  - guest-experience-specialist
- name: Escalation packet
  description: A structured packet routed when a metric breaches an internal action
    threshold or when source systems disagree beyond tolerance, containing the metric
    value, threshold, source lineage, and recommended routing.
  owner: hospitality-analytics-specialist
  consumers:
  - revenue-management-hospitality-specialist
  - hospitality-compliance-specialist
  - property-systems-hospitality-specialist
- name: Source-to-metric lineage map
  description: A mapping from each published metric to its source system, source field,
    extraction timestamp, transformation logic, and refresh schedule.
  owner: hospitality-analytics-specialist
  consumers:
  - property-systems-hospitality-specialist
  - hospitality-compliance-specialist
common_tools:
- name: PMS reporting interface
  description: Property management system reporting or export interface used to extract
    room, rate, folio, and occupancy data.
  use: Primary source for rooms available, rooms sold, ADR, RevPAR, and folio-level
    revenue metrics.
- name: CRS reservation export
  description: Central reservation system export used to extract booking, channel,
    pace, and cancellation data.
  use: Primary source for channel mix, booking pace, pickup, and cancellation metrics.
- name: Channel manager dashboard
  description: Channel manager reporting interface used to extract OTA and distribution
    channel booking data.
  use: Source for channel attribution, OTA commission exposure, and parity monitoring.
- name: POS revenue export
  description: Point-of-sale system export used to extract food and beverage and
    ancillary revenue data.
  use: Source for TrevPAR, ancillary revenue mix, and outlet-level performance.
- name: Loyalty platform export
  description: Loyalty program platform export used to extract member, tier, and
    redemption data.
  use: Source for loyalty penetration, tier distribution, and redemption rate metrics.
- name: Group block and event management system
  description: Group block and event management system export used to extract block
    pickup, release, and attrition data.
  use: Source for group block utilization, attrition tracking, and event revenue
    analysis.
- name: Incident and service-recovery log
  description: Incident tracking system export used to extract service-recovery cases,
    resolution times, and compensation amounts.
  use: Source for service-recovery cycle time, incident rate, and compensation impact
    metrics.
- name: STR benchmark report
  description: STR benchmark report or interface used to extract comp-set occupancy,
    ADR, RevPAR, and RGI data.
  use: Source for comp-set comparison, RGI calculation, and market positioning analysis.
implementation:
  metric_definition_workflow:
    steps:
    - Identify the business question and the decision it supports.
    - Map the question to a named metric in the metric dictionary or propose a new
      metric entry.
    - Identify the authoritative source system and field for each input.
    - Define the formula, denominator logic, and exclusion rules.
    - Define the refresh window and staleness threshold based on source cadence.
    - Document known caveats including comp-set changes, property openings or closings,
      and system migrations.
    - Publish the metric definition to the metric dictionary with version and effective
      date.
  analytical_summary_workflow:
    steps:
    - Select the property, comp set, or portfolio and the reporting period.
    - Extract source data from PMS, CRS, POS, loyalty, channel manager, and group
      block systems.
    - Calculate metrics using the published metric dictionary definitions.
    - Reconcile analytics-layer totals against system-of-record totals and log any
      breaks in the reconciliation register.
    - Attach caveat notes for any source gaps, definitional ambiguity, or comparability
      issues.
    - Check internal action thresholds and route escalation packets for any breaches.
    - Publish the analytical summary with metric values, caveat notes, and lineage
      references.
  reconciliation_workflow:
    steps:
    - Compare analytics-layer totals to system-of-record totals for each metric and
      period.
    - Log any break exceeding tolerance in the reconciliation register with break
      amount and direction.
    - Investigate root cause by tracing source-to-metric lineage.
    - Record root-cause note and assign resolution owner.
    - Track resolution status to closure and update the register.
    - If the break affects a published summary, attach a caveat note and reissue the
      summary.
  escalation_workflow:
    steps:
    - Identify the metric value, threshold, and direction of breach.
    - Assemble the escalation packet with metric value, threshold, source lineage,
      and period.
    - Route to the appropriate adjacent specialty based on the metric and breach type.
    - Track acknowledgment and resolution by the receiving specialty.
    - Record the escalation outcome in the reconciliation register or caveat note
      as appropriate.
  confidence_and_caveat_posture:
    rules:
    - Publish a confidence level of high only when all source systems are current,
      reconciled, and free of known breaks.
    - Publish a confidence level of medium when one or more source systems have minor
      gaps or stale data that do not materially change the metric direction.
    - Publish a confidence level of low when source systems have material gaps,
      unreconciled breaks, or definitional ambiguity that could change the metric
      direction.
    - Attach a caveat note for every medium or low confidence publication explaining
      the specific gap, break, or ambiguity.
    - Never publish a benchmark or causal claim without explicit comp-set configuration
      validation and source-system agreement.
    - Never publish a guest-facing or investor-facing claim; route those to
      hospitality-compliance-specialist and revenue-management-hospitality-specialist.
