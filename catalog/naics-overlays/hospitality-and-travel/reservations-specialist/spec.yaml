domain_lexicon:
- term: PMS
  definition: Property Management System - the system of record for room inventory, reservations, and guest folios at a hospitality
    property.
- term: Channel Manager
  definition: A distribution platform that synchronizes room availability and rates across multiple booking channels including
    direct websites and online travel agencies.
- term: OTA
  definition: Online Travel Agency - a third-party booking platform that sells hotel rooms to consumers, such as Expedia or
    Booking.com.
- term: Rate Plan
  definition: A defined pricing structure with specific rules for availability, restrictions, and inclusions that governs
    how a room type is sold.
- term: Room Block
  definition: A set of rooms held in inventory for a group booking, typically with a negotiated rate and release date.
- term: Guarantee Policy
  definition: The policy requiring a credit card or deposit to hold a reservation, specifying when and how much is charged.
- term: Cut-off Date
  definition: The date by which a group block must be booked or released back to general inventory.
- term: No-show
  definition: A guest who holds a guaranteed reservation but does not arrive and did not cancel, triggering a no-show charge
    per policy.
- term: Overbooking
  definition: A strategy of accepting more reservations than available rooms to account for expected cancellations and no-shows,
    managed within authorized thresholds.
- term: Allotment
  definition: A contracted number of rooms made available to a distribution partner for resale within agreed terms.
common_artifacts:
- Reservation confirmation with confirmation number, dates, room type, rate plan, and guarantee details
- Arrival list with guest names, room assignments, and special requests for front office handoff
- Cancellation log with cancellation reason, fee applied, and confirmation number
- Channel production report showing bookings by source channel and revenue contribution
- Overbooking escalation notice with current sell-through, projected no-shows, and recommended action
- Group block release worksheet with cut-off dates, picked-up rooms, and released inventory
common_tools:
- Property Management System (Oracle OPERA, Mews, Cloudbeds, or equivalent)
- Channel Manager (SiteMinder, D-EDGE, or equivalent)
- Central Reservation System (CRS) for multi-property inventory
- Booking engine for direct website reservations
- Rate shopping and parity monitoring tools
- Reservation reporting and analytics dashboards
implementation:
  workflow_notes:
  - Reservation creation must validate room type availability against the PMS inventory calendar before confirming a booking.
  - Channel manager synchronization must occur within 15 minutes of any inventory or rate change to prevent overbooking across
    channels.
  - Cancellation fees must be applied automatically per the rate plan cancellation policy, with manual override requiring
    revenue management approval.
  - Group block releases must be processed on the cut-off date and released rooms returned to general inventory with notification
    to revenue management.
  - Special requests must be categorized and routed to the appropriate department within 2 hours of reservation creation.
  - No-show processing must occur after the property-defined cutoff time on the arrival date, with charges applied to the
    guarantee card.
  handoff_points:
  - Hands off arrival lists and special requests to guest-services-specialist and front office for pre-arrival preparation.
  - Escalates overbooking thresholds to revenue-management-hospitality-specialist for displacement analysis and walk decisions.
  - Coordinates group block setup and release with event-and-group-bookings-specialist.
  - Routes accessibility and ADA compliance questions to hospitality-compliance-specialist.
  - Reports channel production and booking pace data to hospitality-analytics-specialist for forecasting support.
