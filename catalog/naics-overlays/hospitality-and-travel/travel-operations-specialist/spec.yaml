domain_lexicon:
- term: NEMT
  definition: Non-Emergency Medical Transportation; Medicaid-covered transport for
    eligible members to and from medical appointments when no other means is available.
- term: PHI
  definition: Protected Health Information; individually identifiable health information
    governed by HIPAA that this lane must safeguard in all travel records and communications.
- term: Prior Authorization
  definition: Payer approval required before a service is rendered; this lane verifies
    documentation exists but does not determine authorization outcomes.
- term: Care Transition
  definition: The movement of a patient between care settings; post-discharge travel
    handoffs require coordination with care transition teams.
- term: Transportation Broker
  definition: A state-contracted entity that manages NEMT trip scheduling and dispatch
    for Medicaid members; this lane coordinates with but does not own broker operations.
- term: Travel Readiness
  definition: The verified state where all prerequisites for travel are confirmed,
    including appointment, authorization, transport, lodging, and accessibility needs.
- term: Service Exception
  definition: A documented deviation from expected travel operations workflow requiring
    categorization, routing, and resolution tracking.
- term: Evidence Package
  definition: The compiled set of confirmations, records, and status logs that
    demonstrate a travel operation was completed with verified prerequisites.
- term: Eligibility Verification
  definition: Confirmation that a member or patient has active coverage and benefits
    for the travel service being coordinated; this lane summarizes but does not adjudicate.
- term: Booking Lifecycle
  definition: The sequence of states a travel request moves through from accepted
    intake to closed-with-evidence completion.
common_artifacts:
- name: Travel Readiness Checklist
  description: Documented verification of all prerequisites including appointment,
    authorization, transport, lodging, and accessibility before booking execution.
- name: Booking Confirmation Record
  description: Captured confirmation details for transport and lodging reservations
    including confirmation numbers, dates, and service details.
- name: Exception Summary
  description: Categorized summary of a travel operations exception with routing
    recommendation to the appropriate owner for resolution.
- name: Completion Evidence Package
  description: Compiled evidence including booking confirmations, trip records, lodging
    folios, and status logs demonstrating completed travel operations.
- name: Traveler Notification Log
  description: PHI-controlled record of communications sent to travelers regarding
    booking status, readiness requirements, and exception updates.
- name: Coordination Handoff Record
  description: Structured handoff for care transition or post-discharge travel
    including status, pending items, and receiving owner.
- name: Operations Status Report
  description: Summary report for case managers and leadership showing travel
    operations pipeline status, exceptions, and completion metrics.
common_tools:
- name: Property Management System (PMS)
  use: Query room availability, confirm lodging reservations, and capture folio
    details for covered lodging bookings.
- name: Transportation Broker Platform
  use: Submit and track NEMT trip requests, verify trip status, and capture
    completion records.
- name: CRM System
  use: Maintain traveler contact records, case references, communication logs,
    and status updates in a PHI-controlled environment.
- name: Case Management System
  use: Reference case status, care transition notes, and coordination instructions
    from clinical and care management teams.
- name: Eligibility Verification Portal
  use: Verify member coverage and benefits status from documented payer or plan
    records before executing travel bookings.
- name: Secure Messaging Platform
  use: Send PHI-controlled notifications to travelers, case managers, and
    coordination partners regarding booking status and readiness.
- name: Booking Platform (GDS/OTA)
  use: Search and book air, rail, and other common-carrier travel segments
    for medical travelers when authorized.
- name: Evidence Repository
  use: Store completed evidence packages, confirmation records, and exception
    summaries for audit and reporting.
implementation:
  workflow_stages:
  - stage: accepted
    description: Travel intake received with patient/member identifier and case
      reference. Verify minimum documentation is present to proceed.
  - stage: prerequisite-check
    description: Verify eligibility, benefits, prior authorization, appointment
      confirmation, discharge clearance, and accessibility requirements are
      documented before booking execution.
  - stage: ready-to-book
    description: All prerequisites verified. Proceed to book transport and lodging
      using authorized rate codes, benefit limits, and service parameters.
  - stage: booked
    description: Transport and lodging reservations confirmed. Capture confirmation
      numbers, dates, and service details in the case record.
  - stage: confirmed
    description: Traveler notified of confirmed bookings. Readiness communications
      sent with itinerary, instructions, and contact information.
  - stage: in-transit
    description: Travel in progress. Monitor status and surface exceptions for
      delayed, missed, or disrupted transport.
  - stage: exception
    description: Documented deviation from expected workflow. Categorize, route
      to appropriate owner, and track resolution.
  - stage: rework
    description: Exception resolved or prerequisite updated. Return to appropriate
      prior stage for re-execution.
  - stage: held
    description: Travel operations paused pending external decision (clinical,
      payer, or authorization). Document hold reason and owner.
  - stage: escalated
    description: Exception or hold escalated to leadership or external owner
      for resolution. Track escalation context and response.
  - stage: completed
    description: Travel operations executed. Compile evidence package with
      confirmations, trip records, and folios.
  - stage: closed-with-evidence
    description: Evidence package verified and stored. Case record updated with
      completion status and all supporting documentation.
  phi_handling_rules:
  - Use minimum necessary PHI for booking and coordination purposes only
  - Store travel records in PHI-controlled systems with access logging
  - Route clinical questions to clinical owners without interpreting medical information
  - Summarize eligibility and benefits from documented records without adjudicating
  - Send traveler notifications through secure messaging platforms only
  - Never include diagnosis or treatment details in travel booking records
  escalation_paths:
  - Clinical questions to case manager or care coordinator
  - Payer policy questions to member services or benefits team
  - Authorization questions to utilization management
  - Privacy release questions to compliance or privacy officer
  - Safety-critical transport questions to medical director or transport clinician
  - Booking system failures to property systems hospitality specialist
  - Refund or compensation questions to finance or member services
