domain_lexicon:
- term: PNR
  definition: Passenger Name Record — the GDS record containing all booking, ticketing, and itinerary data for a passenger or group.
- term: IROPS
  definition: Irregular Operations — carrier-declared schedule disruptions (weather, mechanical, ATC) that trigger rebooking and compensation workflows.
- term: BSP
  definition: Billing and Settlement Plan — IATA-administered settlement system for travel agent ticket sales and remittance to carriers.
- term: ARC
  definition: Airlines Reporting Corporation — US settlement and accreditation body for travel agency ticket sales reporting and carrier remittance.
- term: APIS
  definition: Advance Passenger Information System — CBP-mandated pre-arrival passenger data transmission for international flights entering the United States.
- term: Allotment
  definition: Contracted block of rooms or seats held by a travel operator with a supplier, subject to release-back deadlines before which unsold inventory is returned.
- term: Release-back
  definition: The contractual date by which unsold allotment inventory must be returned to the supplier or converted to a firm commitment.
- term: ESTA
  definition: Electronic System for Travel Authorization — CBP pre-travel authorization for Visa Waiver Program travelers entering the United States.
- term: Form of Payment
  definition: The recorded payment instrument in a GDS PNR that drives BSP/ARC settlement categorization and refund processing.
- term: Tariff
  definition: The carrier-filed schedule of fares, rules, and routings that governs ticket pricing and reissue eligibility.
common_artifacts:
- Ticketed itinerary with fare construction and tax breakdown
- IROPS rebooking action log with cost impact and passenger communication record
- BSP/ARC weekly reconciliation worksheet with discrepancy notes
- Supplier allotment utilization dashboard with release-back calendar
- Passenger document verification checklist with compliance status
- Denied-boarding compensation calculation worksheet
- Travel disruption cost summary report by root cause
- Traveler safety status roster during active incidents
common_tools:
- Sabre Red Workspace
- Amadeus Selling Platform Connect
- Travelport Smartpoint
- ARC Memo Manager
- BSP Link
- CBP APIS web portal
- DOT Aviation Consumer Protection complaint portal
- Carrier schedule and disruption alert feeds
implementation:
  deployment_notes: >
    Deploy as the operational execution layer for all travel supply channels
    within a hospitality-and-travel organization. Requires live GDS connectivity
    (Sabre, Amadeus, or Travelport) with active ARC/IATA accreditation for
    ticketing authority. BSP Link and ARC Memo Manager access must be provisioned
    for settlement reconciliation. CBP APIS portal credentials are required for
    international operations. Carrier disruption alert feeds should be integrated
    into the monitoring workflow for real-time IROPS response.
  integration_points:
  - GDS platform APIs for PNR creation, ticketing, and schedule retrieval
  - ARC and BSP settlement systems for weekly reconciliation
  - CBP APIS portal for international passenger data transmission
  - Carrier disruption alert feeds for IROPS monitoring
  - Property PMS for room block allotment synchronization
  - Travel risk management platform for traveler tracking
