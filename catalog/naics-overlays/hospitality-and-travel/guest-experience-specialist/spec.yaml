domain_lexicon:
- term: Guest Journey Map
  definition: >-
    A visual representation of every guest touchpoint from booking through post-stay, annotated with guest expectations,
    emotional state, service actions, and friction points.
- term: Net Promoter Score (NPS)
  definition: >-
    A loyalty metric calculated from the likelihood-to-recommend question, segmented by promoter, passive, and detractor
    responses to gauge overall guest sentiment.
- term: Guest Satisfaction Index (GSI)
  definition: >-
    A composite score aggregating post-stay survey responses across service dimensions such as check-in, room quality,
    cleanliness, and staff interaction.
- term: Service Recovery
  definition: >-
    The structured process of responding to a guest service failure with acknowledgment, compensation, and corrective
    action to restore guest confidence and prevent recurrence.
- term: Guest Preference Profile
  definition: >-
    A persistent record in the PMS or CRM storing a guest's room, bedding, dietary, and recognition preferences for use
    across stays.
- term: Recognition Moment
  definition: >-
    A planned service interaction where staff acknowledge a guest's loyalty status, preference, or occasion to create a
    personalized experience.
- term: Mystery Shopping
  definition: >-
    A quality audit method using trained evaluators who experience the property as guests to assess service delivery
    against brand standards.
- term: Brand Service Standards
  definition: >-
    The documented service expectations and standard operating procedures published by the brand or management company
    that define required guest experience behaviors at each touchpoint.
- term: Service Friction Point
  definition: >-
    A step in the guest journey where the guest encounters delay, confusion, or unmet expectation, identified through
    feedback analysis and journey mapping.
- term: Post-Stay Survey
  definition: >-
    A structured questionnaire sent to guests after departure to measure satisfaction across service dimensions and
    collect verbatim feedback.
common_artifacts:
- Guest Journey Map with friction point annotations
- Guest Satisfaction Dashboard with NPS and GSI trends
- Service Recovery Protocol document with escalation matrix
- Quality Audit Scorecard with brand standard criteria
- Guest Preference Profile configuration guide
- Personalization Rule Set for room and amenity assignment
- Root-Cause Analysis Report for service failures
- Monthly Guest Experience Performance Summary
common_tools:
- Property Management System (PMS) for guest profile and stay data
- Customer Relationship Management (CRM) platform for preference and communication management
- Guest satisfaction survey platform for post-stay and in-stay measurement
- Online review monitoring platform for reputation tracking
- Business intelligence dashboard for satisfaction trend visualization
- Mystery shopping management platform for audit scheduling and reporting
- Task management system for service recovery tracking and escalation
implementation:
  onboarding_steps:
  - Review the current guest journey map and identify the top three friction points from recent survey data
  - Audit existing guest satisfaction survey instruments for coverage of brand service standards
  - Document the current service recovery protocol and map escalation paths
  - Inventory guest preference fields in the PMS and CRM for completeness and accuracy
  - Review the last 90 days of online reviews and categorize recurring themes
  operational_routines:
  - Weekly review of guest satisfaction scores and NPS trend with department heads
  - Daily triage of incoming guest feedback and service recovery cases
  - Monthly quality audit cycle across front office, housekeeping, and guest services
  - Quarterly guest journey map refresh with updated friction point analysis
  - Monthly personalization rule review based on preference data and feedback trends
  handoff_protocols:
  - Escalates service recovery cases exceeding compensation threshold to the General Manager
  - Routes accessibility accommodation requests to the Director of Rooms and Facilities
  - Transfers loyalty program tier disputes to the loyalty program administrator
  - Refers IT system issues affecting guest profiles to the property systems specialist
  - Directs compliance concerns to the hospitality compliance specialist
