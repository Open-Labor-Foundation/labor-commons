      workflows and system responsibilities.
    refresh_interval_days: 365
    decay_policy: review_required_after_interval
    status: active
  next_review_due_at: '2027-01-26'
domain_lexicon:
- term: PMS (Property Management System)
  definition: >-
    The central system of record for room inventory, reservations, guest profiles, folios, and postings at a
    hotel property; examples include Oracle OPERA, Mews, Cloudbeds, and Infor HMS.
- term: Folio
  definition: >-
    The electronic ledger attached to a reservation or guest profile that records all financial postings
    including room charges, taxes, payments, and adjustments; routed to specific windows for split billing.
- term: Rate Code
  definition: >-
    A configured identifier in the PMS that defines a room rate, its inclusions, restrictions, market segment,
    and distribution channel eligibility; controls pricing and package behavior.
- term: Night Audit
  definition: >-
    The end-of-day process that posts room and tax charges, reconciles department postings, rolls the business
    date, and generates financial and operational reports; must complete cleanly for the next business day.
- term: Channel Manager
  definition: >-
    The interface or middleware that synchronizes availability, rates, and reservations between the PMS and
    external distribution channels including OTAs, GDS, and the booking engine.
- term: Posting Rule
  definition: >-
    A configuration in the PMS that determines how a charge or payment is routed to a folio, which transaction
    code it uses, and which general ledger account it maps to.
- term: Room Type
  definition: >-
    A categorization in the PMS that defines a room's physical attributes, bedding configuration, occupancy
    limits, and sellable inventory bucket; rate codes attach to room types.
- term: Interface
  definition: >-
    A configured data exchange between the PMS and an external system such as a POS, key or lock system, energy
    management system, or payment gateway; may use file-based, API, or real-time protocols.
- term: Tokenization
  definition: >-
    The process of replacing payment card data with a surrogate token within the PMS to reduce PCI DSS scope;
    the token is used for folio posting and settlement without storing raw card data.
- term: Overbooking Limit
  definition: >-
    A configurable threshold in the PMS that allows inventory to be sold beyond physical capacity based on
    expected cancellations and no-shows; managed per room type and date.
common_artifacts:
- PMS Configuration Workbook — documented room types, rate codes, packages, and inventory controls
- Interface Map — diagram of all PMS integrations with data flow direction, protocol, and vendor
- User Role Matrix — documented roles, permissions, and access levels for each PMS user group
- Night Audit Runbook — step-by-step procedures for end-of-day processing and exception resolution
- Payment Gateway Configuration Record — documented gateway settings, tokenization scope, and PCI compliance status
- Channel Manager Mapping Sheet — OTA-to-PMS rate and room type mappings with restriction rules
- PMS Upgrade Plan — version target, test plan, rollback procedure, and cutover schedule
- System Configuration Change Log — timestamped record of configuration changes with rationale and approver
