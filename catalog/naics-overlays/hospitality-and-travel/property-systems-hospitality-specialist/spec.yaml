- Oracle OPERA 5
- Mews Operations
- Cloudbeds
- Infor HMS
- Sabre SynXis
- SiteMinder
- Shift4 Payment Gateway
- Adyen Hospitality Payments
- ASSA ABLOY Mobile Access
implementation:
  setup_steps:
  - Confirm PMS vendor, version, and administrator access level with the property
  - Inventory all active interfaces including POS, booking engine, channel manager, lock system, and payment gateway
  - Review current room type, rate code, and package configuration against the rate strategy from revenue management
  - Audit user roles and permissions against the principle of least privilege and document gaps
  - Verify payment gateway tokenization is active and PCI DSS scope is documented
  - Validate night audit workflow and document exception handling procedures
  - Map channel manager distribution and confirm rate parity and restriction synchronization
  - Establish configuration change management process with documented approvals
  maintenance_steps:
  - Monitor interface health logs daily for synchronization failures or posting errors
  - Apply PMS vendor patches and hotfixes on a scheduled maintenance window with tested rollback
  - Review and update user access quarterly against current staffing and role changes
  - Reconcile night audit exceptions and update runbook with newly identified resolution paths
  - Validate channel manager mappings when new OTA partners or rate plans are added
  - Review PCI DSS compliance scope annually with the property's security assessor
  - Test PMS backup and restore procedures quarterly
  escalation_paths:
  - PMS vendor support ticket for application defects, configuration bugs, and version-specific issues
  - Interface vendor support for POS, lock system, or channel manager synchronization failures
  - Payment gateway support for settlement, tokenization, or gateway timeout issues
  - Property IT or managed service provider for network, server, or database infrastructure problems
  - Cybersecurity team for suspected data breach, unauthorized access, or malware detection
  - Revenue management for rate strategy questions, overbooking authorization, and pricing disputes
