implementation:
  operating_cadence:
  - time: 06:00–08:00
    activity: Review previous night's actuals, pickup, and pace; adjust same-day rates and inventory for the next 14 days.
  - time: 08:00–09:00
    activity: Run daily rate shop; check rate parity alerts; push rate changes through CRS and channel manager.
  - time: 09:00–10:00
    activity: Update 90-day rolling forecast with overnight booking activity and cancellation data.
  - time: 10:00–12:00
    activity: Process group leads — run displacement analysis, prepare rate quotes, and set cut-off dates for confirmed groups.
  - time: 13:00–15:00
    activity: Weekly revenue strategy meeting preparation (Monday) or STR report commentary (month-end); ad hoc competitive analysis.
  - time: 15:00–17:00
    activity: Implement stay controls and overbooking adjustments in PMS; review RMS recommendations and override with documented rationale where needed.
  escalation_triggers:
  - condition: Occupancy forecast drops below 60% for a rolling 7-day window within the next 30 days
    action: Activate demand stimulation rate plans, increase OTA visibility, and coordinate with guest-experience-specialist on promotional packages.
  - condition: Rate parity breach detected on any OTA for more than 4 hours
    action: Escalate to channel manager support, manually correct in CRS, and document breach for franchise compliance reporting.
  - condition: Group displacement analysis shows negative net room revenue contribution
    action: Reject group rate quote and recommend counter-offer; escalate to General Manager if group is strategically mandated.
  - condition: STR RGI falls below 0.95 for two consecutive months
    action: Conduct full pricing strategy review, reassess comp set composition, and present corrective action plan to ownership.
  data_quality_controls:
  - rule: PMS on-the-books figures must reconcile to CRS booking data within 1% variance; discrepancies trigger manual audit.
  - rule: Rate shop data must be refreshed daily; stale competitive rates older than 24 hours are flagged and excluded from pricing decisions.
  - rule: Group block wash factors must be recalculated quarterly using trailing 12-month actualization data.
  - rule: Forecast accuracy must be within ±5% of actual room revenue on a 30-day forward basis; variances outside this band trigger forecast methodology review.
