domain_lexicon:
- term: RevPAR
  definition: Revenue Per Available Room — total room revenue divided by total available rooms; the primary top-line performance metric in hospitality revenue management.
- term: ADR
  definition: Average Daily Rate — total room revenue divided by total rooms sold; measures average price achieved for occupied rooms.
- term: BAR
  definition: Best Available Rate — the lowest unrestricted, publicly available rate for a room type on a given date; serves as the anchor rate from which all other rate plans derive.
- term: STR
  definition: Smith Travel Research — the industry-standard benchmarking service that produces STAR reports comparing a property's performance against a competitive set.
- term: Comp Set
  definition: Competitive Set — a group of 4 to 25 comparable hotels selected for performance benchmarking via STR STAR reports.
- term: RGI
  definition: Revenue Generation Index — a property's RevPAR divided by the comp set's RevPAR, expressed as a percentage; measures market share.
- term: OTB
  definition: On The Books — confirmed reservations already committed for future arrival dates; the baseline against which incremental demand is forecast.
- term: CTA
  definition: Close To Arrival — an inventory restriction that prevents new arrivals on a specific date while allowing in-house guests to extend.
- term: MLOS
  definition: Minimum Length Of Stay — an inventory restriction requiring bookings to span a minimum number of nights, used to protect high-demand dates from being consumed by short stays.
- term: Displacement Analysis
  definition: The calculation of incremental revenue impact when accepting a group block against forecasted transient demand that would be displaced.
- term: Rate Parity
  definition: The practice of maintaining identical room rates across all distribution channels for the same room type, date, and occupancy to avoid channel conflict.
- term: Pace
  definition: The rate at which bookings are accumulating for future dates compared to the same point in the booking curve historically.
- term: Compression Dates
  definition: Dates when forecasted demand exceeds available inventory, triggering restrictive inventory controls and premium pricing.
- term: Sell-Through
  definition: An inventory control that prioritizes selling remaining inventory in a specific room type or date to avoid being left with unsellable inventory.
- term: Channel Manager
  definition: A middleware platform that synchronizes availability, rates, and inventory across multiple OTA and direct booking channels from a single PMS or CRS connection.
- term: STLY
  definition: Same Time Last Year — a comparison benchmark that measures current booking pace, rate, and occupancy against the equivalent period in the prior year.
- term: Rate Fence
  definition: A logical boundary that separates different rate plans, booking windows, or channel-specific pricing to prevent rate erosion and cannibalization across segments.
common_artifacts:
- name: 90-Day Rolling Demand Forecast
  description: Arrival-date and room-type-level forecast of occupied rooms, ADR, and total room revenue, updated weekly.
- name: Daily Rate Recommendation Sheet
  description: Published BAR rates, restrictions (CTA, MLOS), and channel-level inventory allocation for the next 30 to 90 days.
- name: Weekly Revenue Strategy Meeting Deck
  description: Presentation covering forecast changes, booking pace, comp-set positioning, group pipeline, and recommended strategy adjustments.
- name: Group Displacement Analysis Report
  description: Calculation of incremental and total revenue impact for a proposed group block, including displaced transient revenue and ancillary spend estimate.
- name: Monthly Revenue Management Recap
  description: Performance summary comparing actual RevPAR, ADR, and occupancy to forecast and budget, with variance commentary and comp-set index.
- name: Rate Parity Audit Report
  description: Channel-by-channel comparison of published rates identifying parity breaks, root cause, and resolution status.
- name: Channel Profitability Analysis
  description: Net revenue and cost-per-booking analysis by distribution channel, net of OTA commissions, merchant fees, and direct booking costs.
- name: 10-Day Forward Rate Calendar
  description: Day-by-day rate and restriction plan for the next 10 days, updated daily based on pace and competitor movements.
common_tools:
- name: IDeaS RMS
  category: revenue_management_system
  description: Revenue management system that produces demand forecasts and rate recommendations using historical booking data and market intelligence.
- name: Duetto
  category: revenue_management_system
  description: Cloud-based RMS that integrates with PMS data to provide open pricing and rate recommendations by channel and segment.
- name: PriceLabs
  category: revenue_management_system
  description: Dynamic pricing and revenue management tool for independent properties and short-term rentals.
- name: STR STAR Report
  category: benchmarking
  description: Monthly and weekly competitive set performance report providing ADR, RevPAR, occupancy, and index data.
- name: OTA Insight
  category: rate_shopping
  description: Rate shopping and intelligence platform that monitors competitor rates across channels and alerts on positioning changes.
- name: SynXis (Sabre)
  category: crs
  description: Central reservation system that manages rate plans, inventory, and distribution across OTA, GDS, and brand.com channels.
- name: SiteMinder
  category: channel_manager
  description: Channel manager platform that synchronizes availability and rates across OTAs and direct booking channels.
- name: Oracle OPERA PMS
  category: property_management_system
  description: Property management system that holds reservation data, room inventory, and rate configuration at the property level.
implementation:
  startup_sequence:
  - Ingest PMS on-the-books data and historical booking patterns for the next 90 days
  - Pull latest STR STAR report and update comp-set positioning metrics
  - Review channel manager parity alerts and resolve any open rate parity breaks
  - Run RMS forecast cycle and review rate recommendations for the next 14 days
  - Update competitive shop grid and flag any competitor rate changes exceeding threshold
  - Produce daily rate recommendation sheet and publish to CRS
  - Verify rate propagation to all connected channels
  operating_rhythm:
  - Daily — Review RMS recommendations, publish rates, check parity alerts, monitor pace
  - Weekly — Run Revenue Strategy Meeting, update 90-day forecast, review group pipeline
  - Monthly — Produce revenue recap, analyze channel profitability, review comp-set composition
  - Quarterly — Review rate plan hierarchy, reassess overbooking thresholds, update comp set
  escalation_triggers:
  - Rate parity break unresolved for more than 24 hours
  - Booking pace deviates more than 15 percent from forecast for a compression date
  - Comp-set RevPAR index drops below target band for two consecutive months
  - Group displacement analysis shows negative incremental revenue impact
  - Overbooking threshold exceeded resulting in walked guest
knowledge_baseline:
  source_baseline_version: '2026-07-30'
  authority_sources:
  - source_id: str-star-report
    title: STR STAR Report — Monthly Hotel Performance Benchmarking
    publisher: STR (Smith Travel Research)
    source_type: evidence-and-control-standard
    location: https://str.com/products/star-report
    authority_reason: >-
      STR is the industry-standard benchmarking service for hotel performance;
      the STAR report is the primary data source that revenue managers use to
      measure RevPAR, ADR, and occupancy against a competitive set, making it
      the authoritative reference for comp-set positioning and performance index.
    refresh_interval_days: 30
    decay_policy: review_required_after_interval
    status: active
  - source_id: ahla-usali-11th
    title: Uniform System of Accounts for the Lodging Industry, 11th Revised Edition
    publisher: American Hotel and Lodging Association (AHLA) and Hospitality Financial and Technology Professionals (HFTP)
    source_type: named-industry-operating-guidance
    location: https://www.ahla.com/
    authority_reason: >-
      USALI defines the standard financial reporting framework for hotels,
      including the rooms division revenue and expense categories that revenue
      management decisions flow into; revenue managers must align RevPAR and
      ADR reporting with USALI room revenue definitions.
    refresh_interval_days: 365
    decay_policy: review_required_after_interval
    status: active
  - source_id: hsmai-revenue-optimization
    title: HSMAI Revenue Optimization Advisory Board Standards and CRME Certification
    publisher: Hospitality Sales and Marketing Association International (HSMAI)
    source_type: named-industry-operating-guidance
    location: https://www.hsmai.org/revenue-optimization/
    authority_reason: >-
      HSMAI sets the professional standards for hospitality revenue management
      practice through its Revenue Optimization Advisory Board and CRME
      (Certified Revenue Management Executive) certification, defining the
      competencies and ethical framework for rate strategy and forecasting.
    refresh_interval_days: 180
    decay_policy: review_required_after_interval
    status: active
  - source_id: hedna-distribution-standards
    title: HEDNA Electronic Distribution Standards and Best Practices
    publisher: Hotel Electronic Distribution Network Association (HEDNA)
    source_type: named-industry-operating-guidance
    location: https://www.hedna.org/
    authority_reason: >-
      HEDNA defines the standards and best practices for electronic hotel
      distribution, including rate plan structure, channel connectivity, and
      parity management — the distribution architecture that revenue management
      rate strategy depends on for execution.
    refresh_interval_days: 180
    decay_policy: review_required_after_interval
    status: active
  - source_id: opentravel-alliance-schema
    title: OpenTravel Alliance Hotel Rate and Availability Message Specifications
    publisher: OpenTravel Alliance (OTA)
    source_type: evidence-and-control-standard
    location: https://www.opentravel.org/
    authority_reason: >-
      The OpenTravel Alliance defines the XML message schemas used to
      transmit rates, availability, and inventory between PMS, CRS, channel
      managers, and OTAs; revenue managers must understand these structures
      to ensure rate plans and restrictions propagate correctly across channels.
    refresh_interval_days: 365
    decay_policy: review_required_after_interval
    status: active
  - source_id: hftp-hitec-standards
    title: HFTP HITEC Technology Standards and USALI Guidance
    publisher: Hospitality Financial and Technology Professionals (HFTP)
    source_type: named-industry-operating-guidance
    location: https://www.hftp.org/
    authority_reason: >-
      HFTP publishes the technology standards and educational guidance for
      hospitality financial systems, including the systems that revenue
      management data flows through; HITEC is the primary venue for PMS, CRS,
      and RMS interoperability standards that affect rate execution.
    refresh_interval_days: 365
    decay_policy: review_required_after_interval
    status: active
  - source_id: aahoa-revenue-management
    title: AAHOA Revenue Management Best Practices for Independent Hotels
    publisher: Asian American Hotel Owners Association (AAHOA)
    source_type: recognized-workflow-reference
    location: https://www.aahoa.com/
    authority_reason: >-
      AAHOA represents the majority of US hotel franchisees and independent
      property owners; its revenue management guidance reflects the practical
      constraints of running RMS and rate strategy at the property level for
      branded and independent properties.
    refresh_interval_days: 180
    decay_policy: review_required_after_interval
    status: active
  - source_id: cornell-revenue-management-research
    title: Cornell University Nolan School of Hotel Administration — Revenue Management Research
    publisher: Cornell University Nolan School of Hotel Administration
    source_type: recognized-workflow-reference
    location: https://sha.cornell.edu/
    authority_reason: >-
      Cornell's Hotel School is the leading academic institution for hospitality
      revenue management research, publishing peer-reviewed studies on dynamic
      pricing, forecasting accuracy, and displacement analysis methodology that
      define the analytical foundations of the discipline.
    refresh_interval_days: 365
    decay_policy: review_required_after_interval
    status: active
  - source_id: ftc-deceptive-pricing-guides
    title: FTC Guides Against Deceptive Pricing
    publisher: Federal Trade Commission (FTC)
    source_type: evidence-and-control-standard
    location: https://www.ftc.gov/legal-library/browse/guides/guides-against-deceptive-pricing
    authority_reason: >-
      The FTC's deceptive pricing guides govern how room rates can be advertised
      and compared across channels, directly constraining rate parity practices,
      was-price advertising, and promotional rate messaging that revenue
      management controls.
    refresh_interval_days: 365
    decay_policy: review_required_after_interval
    status: active
