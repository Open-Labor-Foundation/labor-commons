domain_lexicon:
- term: RevPAR
  definition: Revenue Per Available Room — total room revenue divided by total available rooms; the primary performance metric for hotel revenue management.
- term: ADR
  definition: Average Daily Rate — total room revenue divided by total rooms sold; measures average price achieved for occupied rooms.
- term: Comp Set
  definition: Competitive set — a group of 4–25 hotels selected as direct competitors, against which a property's performance is benchmarked in STR STAR reports.
- term: BAR
  definition: Best Available Rate — the baseline unrestricted rate from which all other rate plans are fenced; the anchor point of the pricing ladder.
- term: Pace
  definition: The rate at which bookings are being received compared to the same point in prior booking windows; used to assess whether demand is ahead of or behind forecast.
- term: Pickup
  definition: The net change in rooms on the books for a specific date over a defined period; positive pickup indicates new bookings exceed cancellations.
- term: Wash
  definition: The historical percentage of group block rooms that do not materialize into actual occupied rooms; applied as a discount factor in displacement analysis.
- term: CTA
  definition: Closed to Arrival — a stay control that prevents new arrivals on a specific date while allowing in-house guests to extend.
- term: CTD
  definition: Closed to Departure — a stay control that prevents departures on a specific date, forcing guests to stay an additional night.
- term: HOA
  definition: Minimum Length of Stay Arrival — requires guests arriving on a specific date to stay a minimum number of nights.
- term: HOD
  definition: Minimum Length of Stay Through Departure — requires guests in-house on a specific date to stay through a minimum departure date.
- term: Displacement Analysis
  definition: The calculation of whether accepting a group block at a negotiated rate displaces higher-paying transient business, measured by net room revenue contribution.
- term: Rate Parity
  definition: The practice of maintaining identical room rates across all distribution channels to comply with OTA rate parity clauses and brand standards.
- term: TRevPAR
  definition: Total Revenue Per Available Room — all property revenue (rooms, F&B, spa, parking) divided by total available rooms; used in total revenue optimization.
- term: GOPPAR
  definition: Gross Operating Profit Per Available Room — operating profit divided by available rooms; links revenue strategy to bottom-line profitability.
- term: Cut-off Date
  definition: The date by which a group must release or commit its blocked rooms; uncommitted rooms return to general inventory for sale.
- term: Rate Fence
  definition: A rule or condition (advance purchase, non-refundable, minimum stay, loyalty membership) that creates a legitimate price differentiation between rate plans for the same room type.
common_artifacts:
- name: 90-Day Rolling Revenue Forecast
  description: Day-by-day projection of occupancy, ADR, and RevPAR for the next 90 days, updated weekly with pace adjustments and reforecast assumptions.
- name: Weekly Revenue Strategy Meeting Deck
  description: Presentation covering last week's performance vs. forecast, comp set positioning, pace analysis, upcoming demand events, and recommended rate and inventory actions.
- name: Daily Rate Recommendation Report
  description: Date-by-room-type rate recommendations with rationale, comparing current BAR to RMS algorithm output, competitive positioning, and pace signals.
- name: Group Displacement Analysis Worksheet
  description: Spreadsheet calculating the net room revenue contribution of a proposed group block against displaced transient demand, including wash factor and catering revenue attachment.
- name: Monthly STR Report Commentary
  description: Written analysis of the property's RGI (Revenue Generating Index), market penetration, and comp set ranking, with explanations for variances and recommended strategic responses.
- name: Rate Parity Audit Report
  description: Channel-by-channel comparison of published rates for identical room types and dates, flagging parity breaches and resolution actions.
- name: Annual Room Revenue Budget
  description: Month-by-month projection of rooms revenue, occupancy, and ADR for the fiscal year, with demand drivers, rate assumptions, and channel mix targets.
