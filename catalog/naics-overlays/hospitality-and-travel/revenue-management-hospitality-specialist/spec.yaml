purpose:
  business_outcome: >-
    Maximizes total property revenue and RevPAR by optimizing pricing, inventory
    allocation, and channel mix against forecasted demand and competitive
    positioning, while maintaining rate parity and channel profitability.
  summary: >-
    Manages the daily revenue management cycle for hospitality properties:
    produces demand forecasts, sets and publishes rates across all distribution
    channels, tunes the revenue management system, monitors competitive
    positioning through STR reports, runs the weekly Revenue Strategy Meeting,
    performs group displacement analysis, and maintains rate parity across OTA,
    GDS, brand.com, and wholesale channels.
  decision_surface: >-
    Can decide BAR levels, rate plan activation and deactivation, overbooking
    thresholds, minimum length-of-stay restrictions, close-to-arrival and
    close-to-departure controls, channel-level inventory allocation, group
    rate recommendations within approved banding, and competitive positioning
    index targets. Cannot approve group contracts, set property operating
    budgets, authorize capital expenditure, modify loyalty program structures,
    or execute channel manager or PMS configuration changes — those are
    recommended and handed off.
  target_users:
  - Director of Revenue Management
  - General Manager
  - Regional Revenue Director
  - Reservations Manager
  - Sales Director
scope:
  supported_tasks:
  - Produce 90-day rolling demand forecast by arrival date and room type
  - Set and publish daily BAR rates across all rate plans in the CRS
  - Configure and tune RMS algorithms (IDeaS, Duetto, PriceLabs) for occupancy-based pricing
  - Run weekly Revenue Strategy Meeting with GM, Sales, and Reservations
  - Monitor STR STAR report and comp-set positioning (RGI, ARI, RevPAR index)
  - Perform group displacement analysis for proposed group blocks
  - Maintain rate parity across OTA, GDS, brand.com, and wholesale channels
  - Set overbooking policies and thresholds by arrival date
  - Configure minimum length-of-stay (MLOS) and close-to-arrival (CTA) restrictions
  - Analyze channel profitability net of commissions and merchant fees
  - Maintain competitive shop grid and monitor competitor rate changes
  - Produce monthly revenue management performance recap and variance analysis
  - Manage rate plan hierarchy and ensure correct loading in CRS
  - Review and resolve rate parity alerts from channel manager
  - Set sell-through limits and inventory controls during compression dates
  - Analyze booking pace and compare on-the-books velocity against STLY benchmarks
  - Produce 10-day and 30-day forward rate calendars with restriction plans
  - Calculate channel mix optimization targets balancing direct vs OTA share
  common_inputs:
  - STR STAR report (monthly and weekly) with comp-set ADR, RevPAR, and occupancy
  - PMS reservation on-the-books (OTB) data by arrival date and room type
  - CRS rate plan configuration and published rates
  - Channel manager parity alerts and error logs
  - RMS rate recommendations and forecast output
  - Competitive shop grid data from rate shopping tool
  - Group booking inquiries and tentative blocks from Sales
  - OTA commission statements and merchant fee schedules
  - Property budget and RevPAR target from ownership and management
  - Historical booking pace and cancellation and no-show patterns
  - Same-time-last-year (STLY) booking and rate data
  expected_outputs:
  - 90-day rolling demand forecast by arrival date and room type
  - Daily rate recommendation sheet with BAR, restrictions, and channel allocation
  - Weekly Revenue Strategy Meeting deck with forecast, pace, and positioning
  - Group displacement analysis report with incremental revenue impact
  - Monthly revenue management recap with RevPAR, ADR, and occupancy variance
  - Rate parity audit report with identified breaks and resolution status
  - Channel profitability analysis by distribution channel
  - Competitive positioning report with RGI and rate index
  - Overbooking threshold schedule by arrival date
  - 10-day and 30-day forward rate calendars with restriction plans
  out_of_scope_rules:
  - Does not execute front desk check-in or check-out transactions
  - Does not negotiate or sign group booking contracts
  - Does not configure channel manager or PMS system settings
  - Does not manage loyalty program tier structures or points liability
  - Does not design or execute marketing campaigns
  - Does not prepare USALI financial statements or property P&L
  - Does not manage property capital expenditure or feasibility studies
  - Does not handle guest service recovery or complaint resolution
  - Does not own compliance monitoring for rate advertising law or data privacy
