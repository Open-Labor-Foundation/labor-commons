- hospitality-risk-management-specialist
knowledge_baseline:
  source_baseline_version: '2026-07-29'
  authority_sources:
  - source_id: fda-food-code
    title: 'FDA Food Code 2022: Recommendations of the United States Public Health Service Food and Drug Administration'
    publisher: U.S. Food and Drug Administration
    source_type: evidence-and-control-standard
    location: https://www.fda.gov/food/retail-food-protection/fda-food-code
    authority_reason: >-
      The FDA Food Code is the primary model regulation adopted by state and local health
      departments for retail food service inspections in restaurants, hotel kitchens, and event
      catering operations; it defines the specific temperature, sanitation, and handling standards
      this specialist must translate into property-level SOPs.
    refresh_interval_days: 365
    decay_policy: review_required_after_interval
    status: active
  - source_id: ada-title-iii
    title: 'Americans with Disabilities Act Title III Regulations for Public Accommodations and Commercial Facilities'
    publisher: U.S. Department of Justice Civil Rights Division
    source_type: evidence-and-control-standard
    location: https://www.ada.gov/laws-and-regulations/regulations
    authority_reason: >-
      Title III of the ADA directly governs accessibility obligations for hotels, restaurants,
      and event venues as public accommodations; this specialist uses these regulations to audit
      guest room accessibility, pool lift compliance, service animal policies, and communication
      accommodation procedures.
    refresh_interval_days: 365
    decay_policy: review_required_after_interval
    status: active
  - source_id: osha-hospitality
    title: 'OSHA Hospitality and Lodging Industry Safety and Health Topics'
    publisher: U.S. Department of Labor Occupational Safety and Health Administration
    source_type: named-industry-operating-guidance
    location: https://www.osha.gov/hospitality
    authority_reason: >-
      OSHA's hospitality-specific guidance addresses the unique injury patterns of this industry —
      housekeeping ergonomic strains, kitchen burns and lacerations, slip-and-fall hazards in
      pool and food service areas, and bloodborne pathogen exposure — which this specialist must
      map to OSHA 300 logging and corrective action requirements.
    refresh_interval_days: 365
    decay_policy: review_required_after_interval
    status: active
  - source_id: pci-dss
    title: 'Payment Card Industry Data Security Standard (PCI DSS) v4.0'
    publisher: PCI Security Standards Council
    source_type: evidence-and-control-standard
    location: https://www.pcisecuritystandards.org/document_library
    authority_reason: >-
      PCI DSS governs the security of payment card processing that is core to hotel, restaurant,
      and travel booking operations; this specialist uses it to scope property management system
      environments, POS terminal configurations, and self-assessment questionnaire obligations.
    refresh_interval_days: 365
    decay_policy: review_required_after_interval
    status: active
  - source_id: haccp-guidelines
    title: 'HACCP Principles and Application Guidelines'
    publisher: U.S. Food and Drug Administration
    source_type: recognized-workflow-reference
    location: https://www.fda.gov/food/hazard-analysis-critical-control-point-haccp
    authority_reason: >-
      HACCP is the mandated food safety management system framework for hospitality food service
      operations; this specialist uses these guidelines to build and revise property-level HACCP
      plans identifying critical control points in receiving, storage, preparation, and service.
    refresh_interval_days: 730
    decay_policy: review_required_after_interval
    status: active
  - source_id: ttb-alcohol
    title: 'Alcohol and Tobacco Tax and Trade Bureau Industry Guidance and Permitting'
    publisher: U.S. Department of the Treasury Alcohol and Tobacco Tax and Trade Bureau
    source_type: named-industry-operating-guidance
    location: https://www.ttb.gov/
    authority_reason: >-
      TTB issues federal permits for alcohol beverage operations and enforces labeling, advertising,
      and trade practice rules that affect hotel bars, restaurant beverage programs, and event
      service; this specialist tracks TTB guidance to ensure federal-level alcohol compliance
      alongside state liquor control requirements.
    refresh_interval_days: 365
    decay_policy: review_required_after_interval
    status: active
  - source_id: cdc-vsp
    title: 'CDC Vessel Sanitation Program Operations Manual'
    publisher: U.S. Department of Health and Human Services Centers for Disease Control and Prevention
    source_type: evidence-and-control-standard
    location: https://www.cdc.gov/vessel-sanitation/
    authority_reason: >-
      The Vessel Sanitation Program is the specific regulatory inspection regime for cruise ship
      operations under the cruise industry voluntary participation agreement with CDC; this
      specialist uses the VSP Operations Manual to prepare vessels for unannounced sanitation
      inspections and manage corrective action plans.
    refresh_interval_days: 365
    decay_policy: review_required_after_interval
    status: active
  - source_id: nfpa-101
    title: 'NFPA 101 Life Safety Code'
    publisher: National Fire Protection Association
    source_type: evidence-and-control-standard
    location: https://www.nfpa.org/codes-and-standards/nfpa-101-standard-development/101
    authority_reason: >-
      NFPA 101 is the life safety code adopted by most state and local fire marshals for
      inspecting hotels, restaurants, and assembly occupancies; this specialist uses it to audit
      egress paths, fire door ratings, occupancy load calculations, and emergency lighting
      compliance in hospitality properties.
    refresh_interval_days: 730
    decay_policy: review_required_after_interval
    status: active
  - source_id: dol-whd-hospitality
    title: 'U.S. Department of Labor Wage and Hour Division Hospitality Industry Compliance Resources'
    publisher: U.S. Department of Labor Wage and Hour Division
    source_type: named-industry-operating-guidance
    location: https://www.dol.gov/agencies/whd/industries/hospitality
    authority_reason: >-
      The WHD hospitality-specific resources address FLSA tip credit calculations, tip pooling
      legality, overtime for tipped employees, and child labor restrictions in restaurant and
      lodging operations — all core labor compliance decisions this specialist must translate
      into payroll and scheduling procedures.
    refresh_interval_days: 365
    decay_policy: review_required_after_interval
    status: active
  next_review_due_at: '2026-10-27'
domain_lexicon:
- term: HACCP Plan
  definition: >-
    A documented food safety system identifying critical control points, critical limits,
    monitoring procedures, and corrective actions for each step in a hospitality food service
    operation from receiving through service.
- term: Tip Credit
  definition: >-
    The FLSA provision allowing employers to pay tipped employees a sub-minimum cash wage when
    tips make up the difference; hospitality-specific rules govern tip pooling, tip retention,
    and the maximum tip credit percentage by jurisdiction.
- term: Occupancy Load
  definition: >-
    The maximum number of persons permitted in a building or space as determined by NFPA 101
    egress capacity calculations and posted by the local fire marshal; hospitality venues must
    post and enforce this limit in assembly spaces, bars, and event halls.
- term: VSP Score
  definition: >-
    The numerical sanitation inspection score (0 to 100) assigned by CDC Vessel Sanitation Program
    inspectors to cruise ships; scores below 86 require corrective action and resurveillance.
- term: ADA Communication Access
  definition: >-
    The Title III obligation for hotels and event venues to provide auxiliary aids and services —
    such as ASL interpreters, captioning, and accessible reservation systems — at no additional
    charge to guests with communication disabilities.
- term: PCI DSS SAQ
  definition: >-
    Self-Assessment Questionnaire used by hospitality merchants to validate payment card
    environment compliance; the specific SAQ version (A, B, C, D, or P2PE) depends on payment
    processing architecture and cardholder data storage practices.
common_artifacts:
- name: Health Inspection Correction Log
  description: >-
    Tracking document for violations cited in state or local health department inspections,
    including violation code, corrective action assigned, responsible manager, completion date,
    and re-inspection status.
- name: ADA Accessibility Audit Report
  description: >-
    Property-level audit documenting compliance with 2010 ADA Standards for Accessible Design,
    covering guest room door widths, bathroom grab bar placement, pool lift availability,
    parking space counts and signage, and service counter heights.
- name: OSHA 300 Log
  description: >-
    OSHA-required injury and illness log with hospitality-specific incident categorization for
    housekeeping strains, kitchen burns, slip injuries, and bloodborne pathogen exposures.
- name: Alcohol Service Certification Roster
  description: >-
    Tracking matrix of all employees who serve alcohol, their certification type (TIPS, ServSafe
    Alcohol, state-specific), certification expiration dates, and retraining schedule.
- name: PCI DSS Attestation of Compliance
  description: >-
    Annual attestation documenting the property self-assessment questionnaire results, scope
    boundaries for cardholder data environments, and remediation status for identified
    vulnerabilities.
common_tools:
- name: ServSafe Manager
  category: certification_platform
  description: >-
    National Restaurant Association food safety certification platform used to train and test
    food service managers on FDA Food Code requirements and HACCP principles.
- name: TIPS (Training for Intervention ProcedureS)
  category: certification_platform
  description: >-
    Alcohol service training and certification program addressing responsible beverage service,
    intoxication recognition, and legal compliance with state liquor control requirements.
- name: HotSchedules Compliance Module
  category: workforce_compliance
  description: >-
    Workforce management platform with compliance tracking for food handler cards, alcohol
    certifications, and training completion deadlines across hospitality properties.
- name: RizePoint
  category: audit_management
  description: >-
    Quality and compliance audit management platform used in hospitality to conduct food safety
    inspections, brand standard audits, and corrective action tracking with mobile data
    collection.
implementation:
  deployment_notes: >-
    Deploy this specialist with access to property management system configuration for PCI DSS
    scoping, health department inspection portals for each operating jurisdiction, and OSHA
    injury tracking forms. Requires coordination with the property-operations-specialist for
    physical corrective actions such as ADA barrier removal and fire code egress modifications,
    and with the food-and-beverage-operations-specialist for HACCP plan execution. For
    multi-property portfolios, maintain a jurisdictional matrix tracking differing state food
    code adoptions, liquor control regulations, and occupancy tax rates.
  integration_points:
  - system: Property Management System (PMS)
    purpose: PCI DSS scope identification and guest data privacy compliance review
  - system: Point of Sale (POS) System
    purpose: Payment security audit and alcohol service transaction monitoring
  - system: Learning Management System (LMS)
    purpose: Training certification tracking for food safety, alcohol service, and anti-trafficking programs
  - system: OSHA Injury Tracking Application
    purpose: OSHA 300 and 300A log maintenance and annual summary submission
