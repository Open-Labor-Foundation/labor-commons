knowledge_baseline:
  source_baseline_version: '2026-07-29'
  authority_sources:
  - source_id: ada-title-iii
    title: 'ADA Title III Regulations for Public Accommodations and Commercial Facilities (28 CFR Part 36)'
    publisher: U.S. Department of Justice Civil Rights Division
    source_type: named-industry-operating-guidance
    location: https://www.ada.gov/law-and-regs/regulations/title-iii-regulations/
    authority_reason: >-
      The DOJ Civil Rights Division is the federal enforcement authority for ADA
      Title III accessibility standards in places of public accommodation including
      hotels, restaurants, and event venues; its regulations define the specific
      barrier-removal obligations and accessibility survey criteria this lane audits against.
    refresh_interval_days: 365
    decay_policy: review_required_after_interval
    status: active
  - source_id: fda-food-code
    title: 'FDA Food Code (2022 Recommendations of the United States Public Health Service)'
    publisher: U.S. Food and Drug Administration
    source_type: evidence-and-control-standard
    location: https://www.fda.gov/food/retail-food-protection/fda-food-code
    authority_reason: >-
      The FDA Food Code is the model reference that state and local health
      departments adopt as the legal basis for restaurant and food service
      inspection; it defines the temperature controls, hygiene standards, and
      HACCP requirements this lane tracks in health inspection findings.
    refresh_interval_days: 365
    decay_policy: review_required_after_interval
    status: active
  - source_id: osha-hotel-lodging
    title: 'OSHA Hotel and Lodging Industry Safety and Health Standards'
    publisher: Occupational Safety and Health Administration
    source_type: named-industry-operating-guidance
    location: https://www.osha.gov/industries/hotel-lodging
    authority_reason: >-
      OSHA is the federal workplace safety regulator whose general industry
      standards (29 CFR 1910) apply to hotel housekeeping, kitchen, and
      maintenance operations; this page consolidates the specific standards
      and hazard recognition guidance for hospitality workplaces.
    refresh_interval_days: 365
    decay_policy: review_required_after_interval
    status: active
  - source_id: pci-dss
    title: 'Payment Card Industry Data Security Standard (PCI DSS v4.0)'
    publisher: PCI Security Standards Council
    source_type: evidence-and-control-standard
    location: https://www.pcisecuritystandards.org/standards/pci-dss/
    authority_reason: >-
      The PCI SSC is the global standards body that sets the card data security
      requirements enforced by acquiring banks on hospitality merchants; PCI DSS
      v4.0 defines the self-assessment questionnaire scope and control objectives
      this lane completes for PMS and POS payment environments.
    refresh_interval_days: 365
    decay_policy: review_required_after_interval
    status: active
  - source_id: ttb-labeling
    title: 'TTB Advertising and Labeling Regulations for Alcohol Beverages'
    publisher: Alcohol and Tobacco Tax and Trade Bureau
    source_type: named-industry-operating-guidance
    location: https://www.ttb.gov/labeling
    authority_reason: >-
      TTB is the federal regulator that controls alcohol beverage labeling,
      advertising, and permit requirements; its rules govern how hotel bars,
      restaurants, and event venues may advertise and serve alcoholic beverages
      and what labeling compliance this lane verifies.
    refresh_interval_days: 365
    decay_policy: review_required_after_interval
    status: active
  - source_id: vgb-pool-safety
    title: 'Virginia Graeme Baker Pool and Spa Safety Act (15 U.S.C. § 8001)'
    publisher: U.S. Consumer Product Safety Commission
    source_type: evidence-and-control-standard
    location: https://www.cpsc.gov/Safety-Education/Safety-Education-Centers/Pool-Safely
    authority_reason: >-
      The CPSC is the federal enforcement agency for the VGB Act, which mandates
      anti-entrapment drain covers and other safety systems in public pools and
      spas at hotels and resorts; this source defines the specific equipment
      certification and inspection criteria this lane audits.
    refresh_interval_days: 365
    decay_policy: review_required_after_interval
    status: active
  - source_id: cdc-mahc
    title: 'CDC Model Aquatic Health Code (MAHC)'
    publisher: Centers for Disease Control and Prevention
    source_type: recognized-workflow-reference
    location: https://www.cdc.gov/healthywater/swimming/mahc/
    authority_reason: >-
      The CDC MAHC is the evidence-based model code that state and local health
      departments adopt for public pool and spa water quality, disinfection, and
      facility design standards; it defines the operational water chemistry and
      facility inspection criteria this lane monitors at hospitality aquatic venues.
    refresh_interval_days: 365
    decay_policy: review_required_after_interval
    status: active
  - source_id: ccpa-cpra
    title: 'California Consumer Privacy Act (CCPA) as amended by CPRA'
    publisher: California Department of Justice, Office of the Attorney General
    source_type: named-industry-operating-guidance
    location: https://oag.ca.gov/privacy/ccpa
    authority_reason: >-
      The California AG is the enforcement authority for CCPA/CPRA, which governs
      how hospitality businesses collect, use, and disclose guest personal data
      for California residents; this source defines the data subject request
      workflows and privacy notice requirements this lane implements.
    refresh_interval_days: 180
    decay_policy: review_required_after_interval
    status: active
  - source_id: gdpr
    title: 'General Data Protection Regulation (EU) 2016/679'
    publisher: European Union
    source_type: named-industry-operating-guidance
    location: https://gdpr-info.eu/
    authority_reason: >-
      GDPR is the binding EU regulation governing processing of personal data
      for EU residents, directly applicable to hotel and travel brands serving
      European guests; it defines the lawful basis, consent, and data subject
      rights obligations this lane enforces in guest data handling workflows.
    refresh_interval_days: 365
    decay_policy: review_required_after_interval
    status: active
  - source_id: ftc-can-spam
    title: 'CAN-SPAM Act: A Compliance Guide for Business'
    publisher: Federal Trade Commission
    source_type: named-industry-operating-guidance
    location: https://www.ftc.gov/business-guidance/resources/can-spam-act-compliance-guide-business
    authority_reason: >-
      The FTC is the federal enforcement agency for the CAN-SPAM Act, which
      governs commercial email including hotel loyalty program promotions and
      booking confirmations; this source defines the unsubscribe, header, and
      subject-line requirements this lane audits in email campaign workflows.
    refresh_interval_days: 365
    decay_policy: review_required_after_interval
    status: active
  - source_id: ftc-advertising
    title: 'FTC Advertising and Marketing on the Internet: Rules of the Road'
    publisher: Federal Trade Commission
    source_type: named-industry-operating-guidance
    location: https://www.ftc.gov/business-guidance/resources/advertising-marketing-internet-rules-road
    authority_reason: >-
      The FTC enforces truth-in-advertising standards that apply to hotel rate
      displays, resort fee disclosures, and promotional offer claims; this source
      defines the disclosure timing and clarity requirements this lane verifies
      in digital booking channels and advertising copy.
    refresh_interval_days: 365
    decay_policy: review_required_after_interval
    status: active
  next_review_due_at: '2026-10-27'
domain_lexicon:
- term: ADA Title III
  definition: >-
    The section of the Americans with Disabilities Act requiring places of
    public accommodation including hotels, restaurants, and event venues to
    remove architectural barriers and provide auxiliary aids for guests with
    disabilities.
- term: FDA Food Code
  definition: >-
    A model regulation published by the FDA that state and local health
    departments adopt as the legal basis for food service inspection,
    covering temperature control, hygiene, allergen management, and HACCP.
- term: PCI DSS SAQ
  definition: >-
    Payment Card Industry Data Security Standard Self-Assessment Questionnaire,
    a validation tool merchants complete annually to attest compliance with
    card data security requirements.
- term: VGB Act
  definition: >-
    Virginia Graeme Baker Pool and Spa Safety Act, federal law requiring
    anti-entrapment drain covers and safety systems in public pools and spas.
- term: MAHC
  definition: >-
    CDC Model Aquatic Health Code, an evidence-based model code for public
    swimming pool design, construction, operation, and maintenance.
- term: Resort Fee
  definition: >-
    A mandatory daily fee charged by hotels covering amenities, subject to FTC
    truth-in-advertising disclosure requirements regarding rate transparency.
- term: HACCP
  definition: >-
    Hazard Analysis and Critical Control Points, a systematic preventive
    approach to food safety identifying biological, chemical, and physical
    hazards in production processes.
- term: OSHA 300 Log
  definition: >-
    The OSHA Form 300 Log of Work-Related Injuries and Illnesses, required for
    establishments with 11 or more employees to record reportable workplace
    incidents.
common_artifacts:
- name: Facility Compliance Audit Report
  description: >-
    Property-level audit document covering ADA accessibility, food safety,
    pool safety, fire life safety, and payment security findings with
    severity ratings and corrective action assignments.
- name: Corrective Action Plan
  description: >-
    Tracked remediation document listing each compliance finding, assigned
    owner, target completion date, verification method, and current status.
- name: Monthly Compliance Scorecard
  description: >-
    Portfolio-level dashboard summarizing inspection scores, open findings,
    overdue corrective actions, training completion rates, and incident trends.
- name: Regulatory Change Impact Assessment
  description: >-
    Analysis document evaluating how a newly published or amended regulation
    affects existing property-level controls, training, and documentation.
- name: PCI DSS SAQ Evidence Binder
  description: >-
    Compiled documentation supporting Self-Assessment Questionnaire responses
    including network diagrams, payment flow descriptions, and control evidence.
- name: Staff Training Certification Tracker
  description: >-
    Matrix tracking food handler, responsible alcohol service, allergen
    awareness, and workplace safety certification status for all required staff.
common_tools:
- name: Property Management System (PMS)
  purpose: >-
    Source of guest data flow and payment processing context for PCI DSS scope
    determination and privacy data mapping.
- name: Point-of-Sale (POS) System
  purpose: >-
    Restaurant and bar transaction system evaluated for PCI DSS compliance and
    alcohol service age verification controls.
- name: Learning Management System (LMS)
  purpose: >-
    Platform for delivering and tracking completion of food safety, alcohol
    service, and compliance training certifications.
- name: Incident Management System
  purpose: >-
    System for logging guest injuries, foodborne illness complaints, and
    workplace safety incidents for OSHA reporting and corrective action tracking.
- name: Compliance Management Platform
  purpose: >-
    Centralized repository for audit findings, corrective actions, inspection
    records, and regulatory change tracking across the property portfolio.
implementation:
  onboarding_steps:
  - Ingest the property portfolio inventory including property type, outlet types, pool/spa presence, and jurisdiction.
  - Load current health department inspection history and open violation notices for each food service outlet.
  - Import the most recent OSHA 300 logs and incident reports for each property.
  - Collect existing PCI DSS SAQ responses and network architecture diagrams for payment environments.
  - Review current ADA accessibility survey records and identify properties with outdated or missing surveys.
  - Inventory active state liquor licenses and responsible beverage service training certifications.
  - Audit current privacy notices, data subject request workflows, and loyalty email suppression processes.
  - Establish baseline compliance scorecard for each property and the portfolio.
  operational_policies:
  - Escalate any critical or repeat health inspection violation to the Property General Manager within 24 hours of receipt.
  - Require annual PCI DSS SAQ completion before the anniversary of the prior year's attestation.
  - Trigger a regulatory change impact assessment within 5 business days of a published federal or state rule change affecting hospitality operations.
  - Verify responsible alcohol service certification is current for every bartender and server before scheduled shifts.
  - Maintain all compliance documentation for a minimum of 3 years or the jurisdiction-specific retention requirement, whichever is longer.
  refusal_triggers:
  - Requests for legal interpretation of ambiguous regulatory language are routed to legal counsel.
  - Requests to approve capital expenditure for barrier removal or equipment upgrades are routed to operations and finance.
  - Requests to release guest personal data to third parties are routed to legal counsel and privacy operations.
  - Requests to set room rates or modify resort fee structures are routed to revenue management.
  - Requests to hire, terminate, or discipline staff are routed to human resources.
